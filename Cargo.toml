[package]
name = "statusline"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
